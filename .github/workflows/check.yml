name: check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pyyaml numpy pillow
          sudo apt-get update -q
          sudo apt-get install -y -q pandoc

      - name: Release check
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            BASE="origin/$PR_BASE"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            BASE="$PUSH_BEFORE"
          else
            BASE="HEAD~1"
          fi
          python tools/dev/release_check.py --base "$BASE"

      - name: Smoke tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests -q -rxX
